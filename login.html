    --navy-900: #071a2e;
    --navy-700: #0d2d4d;
    --amber-400: #ffc548;
    --amber-500: #f5a623;
    --amber-700: #b45f06;
    --amber-800: #9a4f05;
    --ink: #0f2238;
    --muted: #64748b;
    --line: #e4e0d8;
    --paper: #fbf9f5;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    background:
      linear-gradient(160deg, rgba(5,18,34,.84), rgba(8,30,54,.74) 55%, rgba(5,18,34,.92)),
      var(--bg-image) center bottom / cover no-repeat,
      linear-gradient(160deg, #0d2d4d, #071a2e);
    background-attachment: fixed;
  }

  /* soft sun glow */
  body::before {
    content: "";
    position: fixed;
    top: -180px; right: -140px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(255,197,72,.28), transparent 65%);
    pointer-events: none;
  }

  .shell {
    position: relative;
    width: min(980px, 100%);
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    background: var(--paper);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Brand panel ---------- */
  .brand {
    position: relative;
    padding: 44px 44px 40px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 600px;
    background:
      linear-gradient(180deg, rgba(7,26,46,.15), rgba(7,26,46,.82)),
      var(--bg-image) 25% center / cover no-repeat,
      linear-gradient(160deg, #123a63, #071a2e);
  }

  .logo { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; letter-spacing: .2px; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--amber-400), var(--amber-500));
    box-shadow: 0 8px 20px -6px rgba(245,166,35,.7);
  }
  .logo-mark svg { width: 20px; height: 20px; }

  .brand h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(30px, 3.4vw, 40px);
    line-height: 1.15;
    letter-spacing: -.5px;
    margin-bottom: 14px;
  }
  .brand h2 em { font-style: italic; color: var(--amber-400); }
  .brand p { color: rgba(255,255,255,.78); font-size: 15px; line-height: 1.6; max-width: 34ch; }


  /* ---------- Form panel ---------- */
  .form-wrap { padding: 52px 52px 40px; display: flex; flex-direction: column; justify-content: center; }

  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--amber-700); margin-bottom: 10px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -.8px; line-height: 1.1; }
  .sub { color: var(--muted); font-size: 14.5px; margin: 10px 0 30px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #3b4a5e; margin-bottom: 8px; }

  .input {
    position: relative; display: flex; align-items: center;
    background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius);
    transition: border-color .2s, box-shadow .2s;
  }
  .input:focus-within { border-color: var(--amber-500); box-shadow: 0 0 0 4px rgba(245,166,35,.18); }
  .input > svg.icon { width: 18px; height: 18px; margin-left: 16px; color: #94a3b8; flex: none; transition: color .2s; }
  .input:focus-within > svg.icon { color: var(--amber-700); }
  .input input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    padding: 15px 14px; font: inherit; font-size: 15px; color: var(--ink);
  }
  .input input::placeholder { color: #a8b3c2; }

  .toggle {
    border: 0; background: none; cursor: pointer; padding: 8px 14px; margin-right: 4px;
    color: #94a3b8; display: grid; place-items: center; border-radius: 10px; transition: color .2s;
  }
  .toggle:hover { color: var(--amber-700); }
  .toggle svg { width: 19px; height: 19px; }

  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 24px; font-size: 13.5px; }
  .check { display: flex; align-items: center; gap: 9px; cursor: pointer; color: #3b4a5e; user-select: none; }
  .check input { position: absolute; opacity: 0; }
  .box {
    width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #c9d1db; background: #fff;
    display: grid; place-items: center; transition: all .15s;
  }
  .box svg { width: 11px; height: 11px; stroke: #fff; opacity: 0; transform: scale(.6); transition: all .15s; }
  .check input:checked + .box { background: var(--amber-700); border-color: var(--amber-700); }
  .check input:checked + .box svg { opacity: 1; transform: none; }
  .check input:focus-visible + .box { box-shadow: 0 0 0 4px rgba(245,166,35,.25); }

  a { color: var(--amber-700); text-decoration: none; font-weight: 600; }
  a:hover { color: var(--amber-800); text-decoration: underline; text-underline-offset: 3px; }

  .btn {
    width: 100%; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px;
    letter-spacing: .1em; text-transform: uppercase; color: #fff;
    padding: 16px; border-radius: var(--radius);
    background: linear-gradient(135deg, #d9770f, var(--amber-700));
    box-shadow: 0 14px 28px -12px rgba(180,95,6,.75), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 18px 32px -12px rgba(180,95,6,.85), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn:active { transform: translateY(0); }
  .btn.loading { pointer-events: none; opacity: .85; }
  .btn.loading::after {
    content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 10px; vertical-align: -2px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }


  .signup { text-align: center; margin-top: 28px; font-size: 14px; color: var(--muted); }

  .error { display: none; margin-bottom: 16px; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; background: #fdf0ee; color: #a63a2b; border: 1px solid #f3cfc9; }
  .error.show { display: block; }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; max-width: 480px; }
    .brand { min-height: 0; padding: 28px; }
    .brand p { display: none; }
    .brand h2 { font-size: 24px; margin: 22px 0 0; }
    .form-wrap { padding: 34px 28px 30px; }
    h1 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  :root {
    --amber-400: #ffd77a;
    --amber-500: #f5a623;
    --amber-700: #d88d0d;
    --amber-800: #a86b06;
    --ink: #102a43;
    --muted: #576574;
    --line: rgba(16, 42, 67, .18);
    --paper: #fff;
    --radius: 12px;
  }

  body {
    background: linear-gradient(180deg, #f4f8fb 0%, #edf7f2 100%);
    background-attachment: initial;
  }

  body::before { display: none; }

  .shell {
    width: min(980px, 100%);
    min-height: 600px;
    grid-template-columns: 1fr 1fr;
    border: 1px solid rgba(16, 42, 67, .1);
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(16, 42, 67, .16);
  }

  .brand {
    order: 1;
    padding: 44px;
    background:
      linear-gradient(180deg, rgba(7, 26, 46, .24), rgba(7, 26, 46, .88)),
      var(--bg-image) center / cover no-repeat,
      linear-gradient(160deg, #244a73, #102a43);
  }

  .form-wrap {
    order: 2;
    padding: 48px clamp(28px, 5vw, 52px);
  }

  .eyebrow { color: #a86b06; }
  h1 { color: var(--ink); }
  .field label { color: var(--ink); }

  .input {
    border-radius: 10px;
    border-color: #d5dee5;
    background: #fff;
  }

  .input:focus-within {
    border-color: var(--amber-500);
    box-shadow: 0 0 0 3px rgba(245, 166, 35, .18);
  }

  .input > svg.icon { color: #8192a2; }
  .input:focus-within > svg.icon,
  .toggle:hover { color: #a86b06; }
  .toggle { color: #718096; }
  .check { color: var(--ink); }
  .check input:checked + .box { background: #d88d0d; border-color: #d88d0d; }
  .check input:focus-visible + .box { box-shadow: 0 0 0 3px rgba(245, 166, 35, .24); }

  a { color: #244a73; }
  a:hover { color: #102a43; }

  .btn {
    border-radius: 10px;
    color: #102a43;
    background: linear-gradient(135deg, #ffd77a, #f5a623);
    box-shadow: 0 10px 22px -12px rgba(216, 141, 13, .7);
  }

  .btn:hover {
    filter: brightness(.97);
    box-shadow: 0 14px 26px -12px rgba(216, 141, 13, .75);
  }

  .signup { margin-top: 22px; }
  .error { border-radius: 10px; }

  @media (max-width: 820px) {
    .shell { max-width: 520px; }
    .form-wrap { order: 2; padding: 34px 28px 30px; }
    .brand {
      order: 1;
      min-height: 220px;
      padding: 26px 28px;
    }
    .brand p { display: block; }
    .brand h2 { margin: 22px 0 0; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .shell { border-radius: 16px; }
    .form-wrap { padding: 30px 22px 26px; }
    .brand { padding: 24px 22px; }
  }

</style>
</head>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-label="Show password">
            <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember" checked>
          <span class="box"><svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.4 2.4 4.6-5"/></svg></span>
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn" type="submit" id="submitBtn">Log in</button>
    </form>


    <p class="signup">New to Sun Son Solar? <a href="index.html">Create account</a></p>
  </section>
</main>

<script>
  const pw = document.getElementById('password');
  const toggle = document.getElementById('toggle');
  const eye = document.getElementById('eye');
  const form = document.getElementById('loginForm');
  const error = document.getElementById('error');
  const authSessionKey = 'sunSonSolarLoggedIn';

  const eyeOpen = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff  = '<path d="M3 3l18 18"/><path d="M10.600 6.100A9.800 9.800 0 0112 5c6.400 0 10 7 10 7a17 17 0 01-3.200 4M6.600 6.700A17 17 0 002 12s3.600 7 10 7a9.700 9.700 0 004.100-.9"/><path d="M9.900 9.900a3 3 0 004.200 4.200"/>';

  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.innerHTML = show ? eyeOff : eyeOpen;
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const user = form.username.value.trim();
    if (!user || !pw.value) {
      error.textContent = 'Please enter both your username and password.';
      error.classList.add('show');
      return;
    }
    try {
      sessionStorage.setItem(authSessionKey, 'true');
      window.location.assign('landingpage.html');
    } catch {
      error.textContent = 'Unable to sign in in this browser. Please check your browser settings and try again.';
      error.classList.add('show');
    }
  });
</script>
</body>
</html>
